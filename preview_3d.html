<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hunyuan3D-2.1 Hanuman 3D Model Turnaround</title>
  <style>
    body { margin: 0; background: #161622; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #header { position: absolute; top: 12px; left: 16px; z-index: 10; background: rgba(18, 18, 28, 0.85); backdrop-filter: blur(8px); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    h2 { margin: 0 0 6px 0; color: #f5a623; font-size: 17px; font-weight: 700; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; background: #2d3748; color: #cbd5e1; margin-right: 6px; }
    .badge-primary { background: #d97706; color: #fff; }
    .meta { font-size: 13px; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
    .meta strong { color: #f1f5f9; }
    #toolbar { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; background: rgba(18, 18, 28, 0.85); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
    button { background: #27273a; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    button:hover { background: #3b3b55; color: #fff; border-color: #f5a623; }
    button.active { background: #d97706; color: #fff; border-color: #f5a623; }
    #turntableToggle.active { background: #10b981; border-color: #34d399; }
  </style>
</head>
<body>
  <div id="header">
    <div style="margin-bottom: 6px;">
      <span class="badge badge-primary">AI Reconstructed</span>
      <span class="badge">Tencent Hunyuan3D-2.1</span>
    </div>
    <h2>Bala Hanuman 3D Asset</h2>
    <div class="meta">
      <div>Source: <strong>reference/T-Pose_Turnaround.jpeg</strong></div>
      <div>Architecture: <strong>hunyuan3d-dit-v2-1 (Diffusion Transformer)</strong></div>
      <div>Mesh: <strong id="vCount">94,485</strong> verts &bull; <strong id="pCount">189,006</strong> polys</div>
      <div>Format: <strong>GLTF 2.0 Binary (.glb)</strong></div>
    </div>
  </div>

  <div id="toolbar">
    <button id="btnFront" class="active">Front</button>
    <button id="btnThreeQ">3/4 View</button>
    <button id="btnSide">Side</button>
    <button id="btnBack">Back</button>
    <button id="turntableToggle">Auto-Rotate</button>
    <button id="btnWireframe">Wireframe</button>
    <button id="btnMaterial">Warm Cel-Toon</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x13131c);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.1, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    // Warm stage lighting matching the game's cel-shaded palette
    const hemiLight = new THREE.HemisphereLight(0xfff1e0, 0x1f2430, 1.4);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffecd2, 2.2);
    keyLight.position.set(2.5, 4.0, 3.0);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7fb3d5, 0.8);
    fillLight.position.set(-3.0, 2.0, -2.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffd59e, 1.5);
    rimLight.position.set(0, 3.0, -3.5);
    scene.add(rimLight);

    // Circular pedestal
    const pedestalGeo = new THREE.CylinderGeometry(1.2, 1.3, 0.08, 64);
    const pedestalMat = new THREE.MeshStandardMaterial({
      color: 0x1e1e2d,
      roughness: 0.8,
      metalness: 0.2
    });
    const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
    pedestal.position.y = -1.04;
    scene.add(pedestal);

    const ringGeo = new THREE.RingGeometry(1.18, 1.22, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -0.99;
    scene.add(ring);

    let currentMesh = null;
    let standardMat = null;
    let toonMat = null;
    let clayMat = null;
    let matIndex = 0;
    let autoRotate = false;

    const loader = new GLTFLoader();
    loader.load('/models/hanuman_white_mesh.glb', (gltf) => {
      const model = gltf.scene;

      const bbox = new THREE.Box3().setFromObject(model);
      const center = new THREE.Vector3();
      bbox.getCenter(center);
      model.position.sub(center);

      model.traverse((child) => {
        if (child.isMesh) {
          currentMesh = child;
          child.geometry.computeVertexNormals();

          standardMat = new THREE.MeshStandardMaterial({
            color: 0xe59866,
            roughness: 0.55,
            metalness: 0.08
          });

          toonMat = new THREE.MeshToonMaterial({
            color: 0xd97706
          });

          clayMat = new THREE.MeshStandardMaterial({
            color: 0xdeb887,
            roughness: 0.7,
            metalness: 0.05
          });

          child.material = toonMat;
        }
      });

      scene.add(model);
    });

    const setView = (x, y, z, btn) => {
      document.querySelectorAll('#toolbar button').forEach(b => {
        if (b.id !== 'turntableToggle' && b.id !== 'btnWireframe' && b.id !== 'btnMaterial') {
          b.classList.remove('active');
        }
      });
      if (btn) btn.classList.add('active');
      camera.position.set(x, y, z);
      controls.target.set(0, 0, 0);
    };

    document.getElementById('btnFront').addEventListener('click', (e) => setView(0, 0.1, 3.8, e.target));
    document.getElementById('btnThreeQ').addEventListener('click', (e) => setView(2.5, 0.4, 2.8, e.target));
    document.getElementById('btnSide').addEventListener('click', (e) => setView(3.8, 0.1, 0, e.target));
    document.getElementById('btnBack').addEventListener('click', (e) => setView(0, 0.1, -3.8, e.target));

    const turntableBtn = document.getElementById('turntableToggle');
    turntableBtn.addEventListener('click', () => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 2.0;
      turntableBtn.classList.toggle('active', autoRotate);
    });

    let wireframeOn = false;
    document.getElementById('btnWireframe').addEventListener('click', (e) => {
      if (currentMesh) {
        wireframeOn = !wireframeOn;
        currentMesh.material.wireframe = wireframeOn;
        e.target.classList.toggle('active', wireframeOn);
      }
    });

    const matNames = ['Warm Cel-Toon', 'Standard PBR', 'Warm Clay'];
    const mats = () => [toonMat, standardMat, clayMat];
    document.getElementById('btnMaterial').addEventListener('click', (e) => {
      if (currentMesh) {
        matIndex = (matIndex + 1) % 3;
        currentMesh.material = mats()[matIndex];
        currentMesh.material.wireframe = wireframeOn;
        e.target.textContent = matNames[matIndex];
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
