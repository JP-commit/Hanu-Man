<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bala Hanuman 3D Character - Colored, Rigged & Animated</title>
  <style>
    body { margin: 0; background: #13131c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #header { position: absolute; top: 12px; left: 16px; z-index: 10; background: rgba(18, 18, 28, 0.85); backdrop-filter: blur(8px); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); max-width: 440px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    h2 { margin: 0 0 6px 0; color: #f5a623; font-size: 17px; font-weight: 700; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; background: #2d3748; color: #cbd5e1; margin-right: 6px; }
    .badge-primary { background: #d97706; color: #fff; }
    .badge-success { background: #10b981; color: #fff; }
    .meta { font-size: 13px; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
    .meta strong { color: #f1f5f9; }
    
    #controls-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .toolbar { display: flex; gap: 8px; background: rgba(18, 18, 28, 0.88); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    button { background: #27273a; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    button:hover { background: #3b3b55; color: #fff; border-color: #f5a623; }
    button.active { background: #d97706; color: #fff; border-color: #f5a623; }
    .anim-btn.active { background: #2563eb; border-color: #60a5fa; color: #fff; }
    #turntableToggle.active { background: #10b981; border-color: #34d399; }
  </style>
</head>
<body>
  <div id="header">
    <div style="margin-bottom: 6px;">
      <span class="badge badge-primary">Full 3D Character</span>
      <span class="badge badge-success">Colored & Rigged</span>
      <span class="badge">Chapter 1 Bala</span>
    </div>
    <h2>Bala Hanuman 3D Character Model</h2>
    <div class="meta">
      <div>Reference: <strong>reference/T-Pose_Turnaround.jpeg</strong></div>
      <div>Armature: <strong>Mixamo 52-Joint Skeletal Hierarchy</strong></div>
      <div>Animations: <strong>Idle &bull; Walk &bull; Run &bull; Jump</strong></div>
      <div>Mesh: <strong id="vCount">24,982</strong> verts &bull; <strong id="pCount">50,000</strong> faces</div>
      <div>Current State: <strong id="activeState" style="color: #60a5fa;">Rest Pose</strong></div>
    </div>
  </div>

  <div id="controls-panel">
    <!-- Animation Controls -->
    <div class="toolbar">
      <span style="font-size: 12px; font-weight: 700; color: #94a3b8; align-self: center; margin-right: 4px;">ANIMATIONS:</span>
      <button id="btnAnimRest" class="anim-btn active">Rest / T-Pose</button>
      <button id="btnAnimIdle" class="anim-btn">Idle</button>
      <button id="btnAnimWalk" class="anim-btn">Walk</button>
      <button id="btnAnimRun" class="anim-btn">Run</button>
      <button id="btnAnimJump" class="anim-btn">Jump</button>
    </div>

    <!-- Camera Controls -->
    <div class="toolbar">
      <span style="font-size: 12px; font-weight: 700; color: #94a3b8; align-self: center; margin-right: 4px;">VIEW:</span>
      <button id="btnFront" class="active">Front</button>
      <button id="btnThreeQ">3/4 View</button>
      <button id="btnSide">Side</button>
      <button id="btnBack">Back</button>
      <button id="turntableToggle">Auto-Rotate</button>
      <button id="btnWireframe">Wireframe</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x13131c);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.1, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    // Warm stage lighting matching the game's cel-shaded palette
    const hemiLight = new THREE.HemisphereLight(0xfff1e0, 0x1f2430, 1.4);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffecd2, 2.2);
    keyLight.position.set(2.5, 4.0, 3.0);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7fb3d5, 0.8);
    fillLight.position.set(-3.0, 2.0, -2.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffd59e, 1.5);
    rimLight.position.set(0, 3.0, -3.5);
    scene.add(rimLight);

    // Circular pedestal
    const pedestalGeo = new THREE.CylinderGeometry(1.2, 1.3, 0.08, 64);
    const pedestalMat = new THREE.MeshStandardMaterial({
      color: 0x1e1e2d,
      roughness: 0.8,
      metalness: 0.2
    });
    const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
    pedestal.position.y = -0.73;
    scene.add(pedestal);

    const ringGeo = new THREE.RingGeometry(1.18, 1.22, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xd97706, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -0.68;
    scene.add(ring);

    let mixer = null;
    let actions = {};
    let activeAction = null;
    let currentMesh = null;
    let autoRotate = false;
    let clock = new THREE.Clock();

    const urlParams = new URLSearchParams(window.location.search);
    const initialAnim = urlParams.get('anim') || 'rest';
    const freezeTime = urlParams.get('t') !== null ? parseFloat(urlParams.get('t')) : null;

    function playAnimation(name, freezeAt = null) {
      document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('activeState').textContent = name === 'rest' ? 'Rest / T-Pose' : name;

      if (name === 'rest') {
        document.getElementById('btnAnimRest')?.classList.add('active');
        if (activeAction) {
          activeAction.stop();
          activeAction = null;
        }
        if (mixer) mixer.stopAllAction();
        return;
      }

      const btnId = 'btnAnim' + name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
      document.getElementById(btnId)?.classList.add('active');

      const action = actions[name];
      if (!action) return;

      if (activeAction && activeAction !== action) {
        activeAction.fadeOut(0.2);
      }
      action.reset().fadeIn(0.2).play();
      activeAction = action;

      if (freezeAt !== null) {
        mixer.setTime(freezeAt);
        action.paused = true;
      } else {
        action.paused = false;
      }
    }

    // 3-step nearest filter gradient map for toon shading
    const colors = new Uint8Array([70, 160, 255]);
    const gradientMap = new THREE.DataTexture(colors, 3, 1, THREE.RedFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.generateMipmaps = false;
    gradientMap.needsUpdate = true;

    const loader = new GLTFLoader();
    loader.load('/models/bala-hanuman.glb', (gltf) => {
      const model = gltf.scene;

      model.traverse((child) => {
        if (child.isMesh) {
          currentMesh = child;
          child.castShadow = true;
          child.receiveShadow = true;

          const oldMat = child.material;
          const toonMat = new THREE.MeshToonMaterial({
            gradientMap: gradientMap,
            vertexColors: !!child.geometry.attributes.color,
          });

          if (oldMat) {
            if (oldMat.map) {
              oldMat.map.colorSpace = THREE.SRGBColorSpace;
              toonMat.map = oldMat.map;
            }
            if (oldMat.color) {
              toonMat.color.copy(oldMat.color);
            }
          }
          child.material = toonMat;
        }
      });

      // Align character feet to pedestal top (-0.69)
      const box = new THREE.Box3().setFromObject(model);
      model.position.set(0, -box.min.y - 0.69, 0);

      scene.add(model);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        for (const clip of gltf.animations) {
          actions[clip.name] = mixer.clipAction(clip);
          console.log(`Action loaded: ${clip.name} (${clip.duration.toFixed(2)}s)`);
        }

        // Apply initial animation from URL params
        if (initialAnim !== 'rest') {
          const capName = initialAnim.charAt(0).toUpperCase() + initialAnim.slice(1).toLowerCase();
          playAnimation(capName, freezeTime);
        }
      }
    });

    // Button event listeners
    document.getElementById('btnAnimRest').addEventListener('click', () => playAnimation('rest'));
    document.getElementById('btnAnimIdle').addEventListener('click', () => playAnimation('Idle'));
    document.getElementById('btnAnimWalk').addEventListener('click', () => playAnimation('Walk'));
    document.getElementById('btnAnimRun').addEventListener('click', () => playAnimation('Run'));
    document.getElementById('btnAnimJump').addEventListener('click', () => playAnimation('Jump'));

    const setView = (x, y, z, btn) => {
      document.querySelectorAll('.toolbar button').forEach(b => {
        if (!b.classList.contains('anim-btn') && b.id !== 'turntableToggle' && b.id !== 'btnWireframe') {
          b.classList.remove('active');
        }
      });
      if (btn) btn.classList.add('active');
      camera.position.set(x, y, z);
      controls.target.set(0, 0, 0);
    };

    document.getElementById('btnFront').addEventListener('click', (e) => setView(0, 0.1, 3.8, e.target));
    document.getElementById('btnThreeQ').addEventListener('click', (e) => setView(2.5, 0.4, 2.8, e.target));
    document.getElementById('btnSide').addEventListener('click', (e) => setView(3.8, 0.1, 0, e.target));
    document.getElementById('btnBack').addEventListener('click', (e) => setView(0, 0.1, -3.8, e.target));

    const turntableBtn = document.getElementById('turntableToggle');
    turntableBtn.addEventListener('click', () => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 2.0;
      turntableBtn.classList.toggle('active', autoRotate);
    });

    let wireframeOn = false;
    document.getElementById('btnWireframe').addEventListener('click', (e) => {
      if (currentMesh) {
        wireframeOn = !wireframeOn;
        currentMesh.material.wireframe = wireframeOn;
        e.target.classList.toggle('active', wireframeOn);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const initialView = urlParams.get('view') || 'front';
    if (initialView === 'threeq') {
      setView(2.5, 0.4, 2.8, document.getElementById('btnThreeQ'));
    } else if (initialView === 'side') {
      setView(3.8, 0.1, 0, document.getElementById('btnSide'));
    } else if (initialView === 'back') {
      setView(0, 0.1, -3.8, document.getElementById('btnBack'));
    } else {
      setView(0, 0.1, 3.8, document.getElementById('btnFront'));
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer && (!activeAction || !activeAction.paused)) {
        mixer.update(delta);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
